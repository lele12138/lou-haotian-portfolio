name: lou-haotian-portfolio

services:
  site:
    image: openresty/openresty:1.31.1.1-3-alpine
    container_name: lou-haotian-portfolio
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./site:/srv/site:ro
      - ./openresty.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
